name: Deploy Web And API

on:
  push:
    branches:
      - main
    paths:
      - 'apps/web/**'
      - 'apps/api/**'
      - 'Dockerfile'
      - 'railway.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-web-vercel.yml'
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      api: ${{ steps.filter.outputs.api }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            web:
              - 'apps/web/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/deploy-web-vercel.yml'
            api:
              - 'apps/api/**'
              - 'Dockerfile'
              - 'railway.json'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/deploy-web-vercel.yml'

  deploy_web:
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.web == 'true' }}
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_RZLkTzivvfjE5yc8OU9sDUUs
      VERCEL_PROJECT_ID: prj_zl9LUBN8k4iE0lmtONvvFiYfthDX
      VERCEL_AUTH_JSON: ${{ secrets.VERCEL_AUTH_JSON }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_AUTH_TOKEN != '' && secrets.VERCEL_AUTH_TOKEN || secrets.VERCEL_TOKEN }}
      XDG_DATA_HOME: /tmp/vercel-data
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web
        run: npm --workspace @aiv/web run build

      - name: Configure Vercel authentication
        run: |
          set -euo pipefail
          if [[ -n "${VERCEL_AUTH_JSON:-}" ]]; then
            mkdir -p "$XDG_DATA_HOME/com.vercel.cli"
            printf '%s' "$VERCEL_AUTH_JSON" > "$XDG_DATA_HOME/com.vercel.cli/auth.json"
            chmod 600 "$XDG_DATA_HOME/com.vercel.cli/auth.json"
          fi

      - name: Validate Vercel authentication and project access
        working-directory: apps/web
        run: |
          set -euo pipefail
          if [[ -n "${VERCEL_AUTH_JSON:-}" ]]; then
            npx vercel whoami
            npx vercel pull --yes --environment=production
          elif [[ -n "${VERCEL_TOKEN:-}" ]]; then
            npx vercel whoami --token "$VERCEL_TOKEN"
            npx vercel pull --yes --environment=production --token "$VERCEL_TOKEN"
          else
            echo "::error::Missing Vercel credential. Set VERCEL_AUTH_JSON or a Vercel personal access token."
            exit 1
          fi

      - name: Deploy web to Vercel production
        working-directory: apps/web
        run: |
          set -euo pipefail
          if [[ -n "${VERCEL_AUTH_JSON:-}" ]]; then
            npx vercel deploy --prod --yes
          else
            npx vercel deploy --prod --yes --token "$VERCEL_TOKEN"
          fi

  deploy_api:
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.api == 'true' }}
    runs-on: ubuntu-latest
    env:
      RAILWAY_PROJECT_ID: cc4d9027-29cc-4ff6-b101-dc9cb9c4e7e9
      RAILWAY_ENVIRONMENT_ID: d6d02c88-c20e-4de6-a234-be842ff1ca77
      RAILWAY_SERVICE_ID: 897427c6-2c99-4e68-b66e-39fada24e2c6
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_API_TOKEN != '' && secrets.RAILWAY_API_TOKEN || secrets.RAILWAY_TOKEN }}
      OLLAMA_BASE_URL: ${{ secrets.OLLAMA_BASE_URL }}
      OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
      OLLAMA_MODEL: qwen3:4b
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
      OPENROUTER_MODEL: openai/gpt-4o-mini
      OPENROUTER_FALLBACK_MODELS: openai/gpt-4o,openrouter/free,inclusionai/ling-3.0-flash-fin:free,google/gemma-4-31b-it:free
      PERSISTENT_DATA_DIR: /data/ai-v
      LEARNING_DB_PATH: /data/ai-v/learning-db.json
      BACKTEST_DB_PATH: /data/ai-v/backtest-db.json
      MODEL_SETTINGS_PATH: /data/ai-v/model-settings.json
      ODDS_SNAPSHOT_DB_PATH: /data/ai-v/odds-snapshots.json
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate Railway access and selectors
        run: |
          set -euo pipefail
          if [[ -z "${RAILWAY_TOKEN:-}" ]]; then
            echo "::error::Missing Railway token secret. Set either RAILWAY_TOKEN or RAILWAY_API_TOKEN."
            exit 1
          fi
          echo "Railway target project=${RAILWAY_PROJECT_ID} environment=${RAILWAY_ENVIRONMENT_ID} service=${RAILWAY_SERVICE_ID}"
          npx -y @railway/cli@5.35.0 --version
          npx -y @railway/cli@5.35.0 status \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID"

      - name: Sync OpenRouter key to Railway service vars
        run: |
          set -euo pipefail
          if [[ -z "${OPENROUTER_API_KEY:-}" ]]; then
            echo "::warning::OPENROUTER_API_KEY GitHub secret is empty; skipping Railway variable sync."
            exit 0
          fi
          printf '%s' "$OPENROUTER_API_KEY" \
            | npx -y @railway/cli@5.35.0 variable set OPENROUTER_API_KEY --stdin --skip-deploys \
              --service "$RAILWAY_SERVICE_ID" \
              --environment "$RAILWAY_ENVIRONMENT_ID" \
              --project "$RAILWAY_PROJECT_ID" >/dev/null
          echo "Synchronized OPENROUTER_API_KEY to Railway service variables."

      - name: Sync Ollama and OpenRouter model defaults to Railway service vars
        run: |
          set -euo pipefail
          if [[ -n "${OLLAMA_BASE_URL:-}" && -n "${OLLAMA_API_KEY:-}" ]]; then
            npx -y @railway/cli@5.35.0 variable set "OLLAMA_ENABLED=true" "OLLAMA_BASE_URL=$OLLAMA_BASE_URL" "OLLAMA_MODEL=$OLLAMA_MODEL" --skip-deploys \
              --service "$RAILWAY_SERVICE_ID" \
              --environment "$RAILWAY_ENVIRONMENT_ID" \
              --project "$RAILWAY_PROJECT_ID" >/dev/null
            printf '%s' "$OLLAMA_API_KEY" \
              | npx -y @railway/cli@5.35.0 variable set OLLAMA_API_KEY --stdin --skip-deploys \
                --service "$RAILWAY_SERVICE_ID" \
                --environment "$RAILWAY_ENVIRONMENT_ID" \
                --project "$RAILWAY_PROJECT_ID" >/dev/null
            echo "Synchronized external Ollama endpoint to Railway service variables."
          else
            echo "OLLAMA_BASE_URL or OLLAMA_API_KEY GitHub secret is empty; preserving Railway Ollama variables."
          fi
          npx -y @railway/cli@5.35.0 variable set "OPENROUTER_MODEL=$OPENROUTER_MODEL" --skip-deploys \
            --service "$RAILWAY_SERVICE_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" \
            --project "$RAILWAY_PROJECT_ID" >/dev/null
          npx -y @railway/cli@5.35.0 variable set "OPENROUTER_FALLBACK_MODELS=$OPENROUTER_FALLBACK_MODELS" --skip-deploys \
            --service "$RAILWAY_SERVICE_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" \
            --project "$RAILWAY_PROJECT_ID" >/dev/null
          echo "Synchronized OPENROUTER model defaults to Railway service variables."

      - name: Sync The Odds API configuration to Railway service vars
        run: |
          set -euo pipefail
          if [[ -z "${THE_ODDS_API_KEY:-}" ]]; then
            echo "::warning::THE_ODDS_API_KEY GitHub secret is empty; snapshot scheduler will remain unconfigured on Railway."
            exit 0
          fi
          printf '%s' "$THE_ODDS_API_KEY" \
            | npx -y @railway/cli@5.35.0 variable set THE_ODDS_API_KEY --stdin --skip-deploys \
              --service "$RAILWAY_SERVICE_ID" \
              --environment "$RAILWAY_ENVIRONMENT_ID" \
              --project "$RAILWAY_PROJECT_ID" >/dev/null
          npx -y @railway/cli@5.35.0 variable set "THE_ODDS_API_ENABLED=true" --skip-deploys \
            --service "$RAILWAY_SERVICE_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" \
            --project "$RAILWAY_PROJECT_ID" >/dev/null
          echo "Synchronized The Odds API configuration to Railway service variables."

      - name: Sync durable state paths to Railway service vars
        run: |
          set -euo pipefail
          npx -y @railway/cli@5.35.0 variable set "PERSISTENT_DATA_DIR=$PERSISTENT_DATA_DIR" --skip-deploys \
            --service "$RAILWAY_SERVICE_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" \
            --project "$RAILWAY_PROJECT_ID" >/dev/null
          npx -y @railway/cli@5.35.0 variable set "LEARNING_DB_PATH=$LEARNING_DB_PATH" --skip-deploys \
            --service "$RAILWAY_SERVICE_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" \
            --project "$RAILWAY_PROJECT_ID" >/dev/null
          npx -y @railway/cli@5.35.0 variable set "BACKTEST_DB_PATH=$BACKTEST_DB_PATH" --skip-deploys \
            --service "$RAILWAY_SERVICE_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" \
            --project "$RAILWAY_PROJECT_ID" >/dev/null
          npx -y @railway/cli@5.35.0 variable set "MODEL_SETTINGS_PATH=$MODEL_SETTINGS_PATH" --skip-deploys \
            --service "$RAILWAY_SERVICE_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" \
            --project "$RAILWAY_PROJECT_ID" >/dev/null
          npx -y @railway/cli@5.35.0 variable set "ODDS_SNAPSHOT_DB_PATH=$ODDS_SNAPSHOT_DB_PATH" --skip-deploys \
            --service "$RAILWAY_SERVICE_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" \
            --project "$RAILWAY_PROJECT_ID" >/dev/null
          echo "Synchronized durable state paths to Railway service variables."

      - name: Deploy API to Railway
        run: |
          set +e
          npx -y @railway/cli@5.35.0 up \
            --ci \
            --service "$RAILWAY_SERVICE_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" \
            --project "$RAILWAY_PROJECT_ID" 2>&1 | tee railway-up.log
          exit_code=${PIPESTATUS[0]}
          if [[ $exit_code -ne 0 ]]; then
            while IFS= read -r line; do
              echo "::error::${line}"
            done < <(tail -40 railway-up.log)
          fi
          exit $exit_code
